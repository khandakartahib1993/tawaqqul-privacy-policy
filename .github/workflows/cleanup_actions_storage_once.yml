name: Cleanup Actions Storage Once

on:
  push:
    paths:
      - '.github/workflows/cleanup_actions_storage_once.yml'

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete all Actions artifacts and caches
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            while (true) {
              const res = await github.request('GET /repos/{owner}/{repo}/actions/artifacts', { owner, repo, per_page: 100, page: 1 });
              const items = res.data.artifacts || [];
              if (!items.length) break;
              for (const item of items) {
                try { await github.request('DELETE /repos/{owner}/{repo}/actions/artifacts/{artifact_id}', { owner, repo, artifact_id: item.id }); }
                catch (e) { if (e.status !== 404) throw e; }
              }
            }
            while (true) {
              const res = await github.request('GET /repos/{owner}/{repo}/actions/caches', { owner, repo, per_page: 100, page: 1 });
              const items = res.data.actions_caches || [];
              if (!items.length) break;
              for (const item of items) {
                try { await github.request('DELETE /repos/{owner}/{repo}/actions/caches/{cache_id}', { owner, repo, cache_id: item.id }); }
                catch (e) { if (e.status !== 404) throw e; }
              }
            }
